name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest   # SDK Android préinstallé sur les runners GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tests unitaires
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Rapport de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/

      # Release (signée avec la clé partagée) : optimisée, et s'installe
      # par-dessus une version précédente sans désinstaller.
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: Pairing40k
          path: app/build/outputs/apk/release/app-release.apk
